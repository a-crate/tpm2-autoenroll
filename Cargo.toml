[package]
name = "tpm2-autoenrolld"
version = "0.1.0"
edition = "2021"
description = "Re-bind TPM2-enrolled LUKS2 volumes to the current PCR state at the point of unlock"
license = "MIT"

[[bin]]
name = "tpm2-autoenrolld"
path = "src/main.rs"

[dependencies]
libc = "0.2"
rustix = { version = "1", features = ["net", "event", "process", "fs"] }
# Value-walking only, so serde_derive and its proc-macro chain stay out of the
# build: the config file is small, read once, and never written.
serde_json = { version = "1", default-features = false, features = ["std"] }
zeroize = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
